<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>비밀번호 재설정</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/users_base.css') }}">
</head>

<body>

    <div class="signup-page">
        <div class="signup-container">

            <div class="signup-title">
                <h1>수경재배</h1>
                <h2>환경제어 및 모니터링 시스템</h2>
            </div>

            <div class="card signup-card">

                <div class="card-body">

                    <h3 class="signup-heading">
                        비밀번호 재설정
                    </h3>

                    <p style="text-align: center; color: #666; margin-bottom: 25px;">
                        새로운 비밀번호를 입력해주세요.
                    </p>

                    <form method="post" action="/reset_password/{{ user_seq }}" class="signup-form">

                        <!-- 새 비밀번호 -->
                        <div class="mb-3">
                            <label class="form-label">
                                새 비밀번호
                                <span style="color: #e53935; font-size: 12px; font-weight: 500;">
                                    (비밀번호는 8자 이상 입력해주세요.)
                                </span>
                            </label>

                            <input type="password" name="password" id="password" class="form-control"
                                placeholder="새 비밀번호를 입력하세요" required>
                        </div>

                        <!-- 새 비밀번호 확인 -->
                        <div class="mb-3">
                            <label class="form-label">
                                새 비밀번호 확인
                            </label>

                            <input type="password" name="password_confirm" id="password_confirm" class="form-control"
                                placeholder="새 비밀번호를 다시 입력하세요" required>

                            <!-- 일치 / 불일치 표시 -->
                            <div id="password-message" style="font-size: 12px; margin-top: 6px;">
                            </div>
                        </div>

                        <div class="mt-4">

                            <button type="submit" class="btn btn-success w-100">

                                비밀번호 변경

                            </button>

                        </div>

                    </form>

                    <div class="signup-links">

                        <a href="/login">
                            로그인으로 돌아가기
                        </a>

                    </div>

                </div>

            </div>

        </div>
    </div>


    <!-- 비밀번호 일치 여부 확인 -->

    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <script>
                alert("{{ message }}");
            </script>
        {% endfor %}
    {% endwith %}
</body>
<script src="{{ url_for('static', filename='js/reset_password.js') }}"></script>
</html>
