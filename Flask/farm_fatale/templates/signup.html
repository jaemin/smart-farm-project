<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>회원가입</title>

    <!-- 회원가입 페이지 CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/users_base.css') }}">
</head>

<body>

    <div class="signup-page">
        <div class="signup-container">

            <!-- 프로젝트 제목 -->
            <div class="signup-title">
                <h1>수경재배</h1>
                <h2>환경제어 및 모니터링 시스템</h2>
            </div>

            <!-- 회원가입 카드 -->
            <div class="card signup-card">

                <div class="card-body">

                    <h3 class="signup-heading">
                        회원가입
                    </h3>

                    <form method="post" class="signup-form">

                        <!-- 아이디 -->
                        <div class="mb-3">
                            <label class="form-label">
                                아이디
                            </label>

                            <input type="text" name="user_id" id="user_id" class="form-control" placeholder="아이디를 입력하세요"
                                required>

                            <div id="user_id_message" class="input-message"></div>
                        </div>

                        <!-- 비밀번호 -->
                        <div class="mb-3">
                            <label class="form-label">
                                비밀번호 <span class="password-guide">(비밀번호는 8자 이상 입력해주세요.)</span>
                            </label>

                            <input type="password" name="password" id="password" class="form-control"
                                placeholder="비밀번호를 입력하세요" required>

                            <div id="password_message" class="input-message"></div>
                        </div>

                        <!-- 비밀번호 확인 -->
                        <div class="mb-3">
                            <label class="form-label">
                                비밀번호 확인
                            </label>

                            <input type="password" name="password_confirm" id="password_confirm" class="form-control"
                                placeholder="비밀번호를 다시 입력하세요" required>

                            <div id="password_confirm_message" class="input-message"></div>
                        </div>

                        <!-- 이름 -->
                        <div class="mb-3">
                            <label class="form-label">
                                이름
                            </label>

                            <input type="text" name="name" class="form-control" placeholder="이름을 입력하세요" required>
                        </div>

                        <!-- 이메일 -->
                        <div class="mb-3">
                            <label class="form-label">
                                이메일
                            </label>

                            <input type="email" name="email" id="email" class="form-control" placeholder="이메일을 입력하세요"
                                required>

                            <div id="email_message" class="input-message"></div>
                        </div>

                        <!-- 전화번호 -->
                        <div class="mb-3">
                            <label class="form-label">
                                전화번호
                            </label>

                            <input type="tel" name="user_tel" id="user_tel" class="form-control"
                                placeholder="전화번호를 입력하세요" required>

                            <div id="user_tel_message" class="input-message"></div>
                        </div>

                        <!-- 회원가입 버튼 -->
                        <div class="mt-4">

                            <button type="submit" class="btn btn-success w-100">

                                회원가입

                            </button>

                        </div>

                    </form>

                    <!-- 로그인 안내 -->
                    <div class="signup-links">

                        <span>이미 계정이 있으신가요?</span>

                        <a href="/login">
                            로그인 하기
                        </a>

                    </div>

                </div>

            </div>

        </div>
    </div>
    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <script>
                alert("{{ message }}");
            </script>
        {% endfor %}
    {% endwith %}
</body>
<script src="{{ url_for('static', filename='js/signup.js') }}"></script>
</html>
