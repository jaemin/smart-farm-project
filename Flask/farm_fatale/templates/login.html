<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>로그인</title>

    <!-- 로그인 페이지 CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/users_base.css') }}">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <!-- 프로젝트 제목 -->
            <div class="login-title">
                <h1>수경재배</h1>
                <h2>환경제어 및 모니터링 시스템</h2>
            </div>
            <!-- 로그인 카드 -->
            <div class="card login-card">
                <div class="card-body">
                    <form method="post" class="login-form">
                        <!-- 아이디 -->
                        <div class="mb-3">
                            <label class="form-label">
                                아이디
                            </label>
                            <input type="text" name="user_id" class="form-control" placeholder="아이디를 입력하세요" required>
                        </div>
                        <!-- 비밀번호 -->
                        <div class="mb-3">
                            <label class="form-label">
                                비밀번호
                            </label>
                            <input type="password" name="password" class="form-control" placeholder="비밀번호를 입력하세요"
                                required>
                        </div>

                        <!-- 로그인 버튼 -->
                        <div class="mt-4">
                            <button type="submit" class="btn btn-success w-100">로그인</button>
                        </div>
                    </form>

                    <!-- 회원가입 / 비밀번호 찾기 -->
                    <div class="login-links">
                        <a href="/find_id">아이디 찾기</a>
                        <span>|</span>
                        <a href="/find_password">비밀번호 찾기</a>
                        <span>|</span>
                        <a href="/signup" class="signup-link">회원가입하기</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    {% with messages = get_flashed_messages() %}
        {% for message in messages %}
            <script>
                alert("{{ message }}");
            </script>
        {% endfor %}
    {% endwith %}
</body>
</html>
