{% extends 'base.html' %}

{% set active_tab = 'humid' %}
{% block title %}습도 - 수경재배 환경 제어 시스템{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/sensor.css') }}" />
<!-- 상단 제목 & 현재 상태 카드 영역 -->
<div class="sensor-header-row">
    <div class="title-section">
        <h2 class="device-title">습도</h2>
        <span id="current-badge" class="status-badge status-good">양호</span>
        <span id="current-desc" class="status-desc">현재 습도는 적정 범위 내에 있습니다.</span>
    </div>
    <div class="summary-area">
        <div class="refresh-bar">
            <span>마지막 업데이트 : <span id="current-time"></span></span>
            <!-- 새로고침 버튼 (클릭 시 AJAX 데이터 갱신) -->
            <img src="{{ url_for('static', filename='img/refresh.png') }}" id="btn-refresh" class="btn-refresh">
        </div>
        <!-- 우측 상단 현재값 & 최적 범위 -->
        <div class="card-box sensor-summary-card">
            <div class="card-title">현재 값</div>
            <div class="sensor-big-value">
                <span id="current-val">--</span> <span class="unit">%</span>
            </div>
            <div class="optimal-range">
                최적 <span id="opt-min">40</span> ~ <span id="opt-max">70</span> %
            </div>
        </div>
    </div>
</div>

<!-- 실시간 그래프 영역 -->
<div class="card-box graph-card-box">
    <div class="chart-container" id="graphContainer">
        <canvas id="sensorGraphCanvas"></canvas>
    </div>
</div>

<!-- 최근 로그 테이블 (5행 단위 + 번호 추가) -->
<div class="card-box col-span-2">
    <div class="table-header-bar d-flex justify-content-between align-items-center mb-2">
        <div class="card-title">최근 로그 (24시간 기록)</div>
        <!-- CSV 버튼 -->
        <a href="/api/sensor/2/download_csv" class="btn-csv text-decoration-none"
            style="display: inline-block; text-align: center;">CSV 다운로드</a>
    </div>

    <table class="log-table">
        <thead>
            <tr>
                <th style="width: 80px; text-align: center;">번호</th>
                <th>시간</th>
                <th>습도 (%)</th>
                <th>상태</th>
                <th>설명</th>
            </tr>
        </thead>
        <tbody id="log-table-body">
            <!-- JavaScript로 dynamic하게 채워짐 -->
        </tbody>
    </table>

    <!-- 페이지네이션 버튼 영역 -->
    <div class="pagination-wrapper mt-3" style="display: flex; justify-content: center;">
        <nav>
            <ul class="pagination mb-0" id="pagination-list"
                style="display: inline-flex; list-style: none; gap: 5px; padding: 0;"></ul>
        </nav>
    </div>
</div>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    window.setTimeout('window.location.reload()', 60000);

    const SENSOR_SEQ = 2; // 습도 센서 고유 번호
    let chartInstance = null;
    let currentPage = 1;
    const PAGE_SIZE = 5;  // 한 페이지당 5행 출력

    // 현재 날짜 및 시각 포맷팅 (YYYY-MM-DD HH:mm:ss)
    function getFormattedNow() {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const mi = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss}`;
    }

    // 서버 API 데이터 로딩 함수
    function loadSensorData(page = 1) {
        fetch(`/api/sensor/${SENSOR_SEQ}/data?page=${page}&per_page=${PAGE_SIZE}`)
            .then(response => response.json())
            .then(data => {
                // 1. 상단 카드 업데이트
                if (data.current) {
                    document.getElementById('current-val').innerText = Math.round(data.current.value);
                    document.getElementById('opt-min').innerText = Math.round(data.current.min);
                    document.getElementById('opt-max').innerText = Math.round(data.current.max);
                    document.getElementById('current-desc').innerText = data.current.desc;

                    // 상단 뱃지 색상/텍스트 처리 (양호/주의/경고)
                    const badgeEl = document.getElementById('current-badge');
                    badgeEl.innerText = data.current.status;

                    if (data.current.status_class === 'warning') {
                        badgeEl.className = 'status-badge';
                        badgeEl.style.backgroundColor = '#ffedd5';
                        badgeEl.style.color = '#c2410c';
                    } else if (data.current.status_class === 'danger') {
                        badgeEl.className = 'status-badge status-danger';
                        badgeEl.style.backgroundColor = '';
                        badgeEl.style.color = '';
                    } else {
                        badgeEl.className = 'status-badge status-good';
                        badgeEl.style.backgroundColor = '';
                        badgeEl.style.color = '';
                    }
                }

                // 2. 업데이트 시각
                document.getElementById('current-time').innerText = getFormattedNow();

                // 3. 차트 / 테이블 / 페이지네이션 렌더링
                renderGraph(data.chart);
                renderTable(data.table, page);
                renderPagination(data.pagination.total_pages, data.pagination.current_page);
            })
            .catch(err => console.error("습도 데이터 로딩 실패:", err));
    }

    // X축 눈금 및 차트 렌더링
    function renderGraph(chartData) {
        const ctx = document.getElementById('sensorGraphCanvas').getContext('2d');
        if (chartInstance) chartInstance.destroy();

        const maxLimitLine = {
            label: '상한 기준',
            data: Array(chartData.labels.length).fill(chartData.max_limit),
            borderColor: '#ff0000',
            borderWidth: 1.5,
            borderDash: [4, 4],
            pointRadius: 0,
            fill: false
        };

        const minLimitLine = {
            label: '하한 기준',
            data: Array(chartData.labels.length).fill(chartData.min_limit),
            borderColor: '#66b2ff',
            borderWidth: 1.5,
            borderDash: [4, 4],
            pointRadius: 0,
            fill: false
        };

        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: chartData.labels,
                datasets: [
                    {
                        label: '습도 (%)',
                        data: chartData.values.map(v => Math.round(v)),
                        borderColor: '#68b855',
                        borderWidth: 2,
                        pointRadius: 0,
                        tension: 0.4,
                        fill: false
                    },
                    maxLimitLine,
                    minLimitLine
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: {
                        min: Math.floor(chartData.min_limit - 5),
                        max: Math.ceil(chartData.max_limit + 5),
                        grid: { color: '#f0f0f0' }
                    },
                    x: {
                        grid: { display: false },
                        ticks: {
                            maxTicksLimit: 14,
                            maxRotation: 0
                        }
                    }
                }
            }
        });
    }

    // 로그 테이블 (양호, 주의, 경고)
    function renderTable(tableData, page) {
        const tbody = document.getElementById('log-table-body');
        const startNum = (page - 1) * PAGE_SIZE;

        tbody.innerHTML = tableData.slice(0, PAGE_SIZE).map((row, index) => {
            let colorStyle = 'color: #2563eb;'; // 양호

            if (row.status_class === 'warning') {
                colorStyle = 'color: #f97316;'; // 주의
            } else if (row.status_class === 'danger') {
                colorStyle = 'color: #ef4444;'; // 경고
            }

            return `
        <tr>
          <td style="text-align: center; color: #666; font-weight: 500;">${startNum + index + 1}</td>
          <td>${row.recorded_at}</td>
          <td><b>${Math.round(row.value)}</b></td>
          <td style="${colorStyle} font-weight: bold;">${row.status}</td>
          <td>${row.desc}</td>
        </tr>
      `;
        }).join('');
    }

    // 페이지네이션 렌더링
    function renderPagination(totalPages, page) {
        currentPage = page;
        const paginationList = document.getElementById('pagination-list');
        let html = '';

        const pageBlockSize = 5;
        const currentBlock = Math.ceil(page / pageBlockSize);
        const startPage = (currentBlock - 1) * pageBlockSize + 1;
        let endPage = startPage + pageBlockSize - 1;
        if (endPage > totalPages) endPage = totalPages;

        const baseStyle = "padding: 6px 12px; border: 1px solid #ddd; text-decoration: none; border-radius: 4px; display: inline-block;";

        // 이전 블록 버튼
        if (startPage > 1) {
            html += `
        <li style="display: inline;">
          <a href="#" onclick="loadSensorData(${startPage - 1}); return false;" style="${baseStyle} background-color: #fff; color: #555;">&laquo;</a>
        </li>
      `;
        }

        // 숫자 버튼
        for (let i = startPage; i <= endPage; i++) {
            const activeStyle = (i === page)
                ? 'font-weight: bold; background-color: #68b855; color: white; border-color: #68b855;'
                : 'background-color: #f8f9fa; color: #333;';

            html += `
        <li style="display: inline;">
          <a href="#" onclick="loadSensorData(${i}); return false;" style="${baseStyle} ${activeStyle}">
             ${i}
          </a>
        </li>
      `;
        }

        // 다음 블록 버튼
        if (endPage < totalPages) {
            html += `
        <li style="display: inline;">
          <a href="#" onclick="loadSensorData(${endPage + 1}); return false;" style="${baseStyle} background-color: #fff; color: #555;">&raquo;</a>
        </li>
      `;
        }

        paginationList.innerHTML = html;
    }

    // 초기화
    document.addEventListener("DOMContentLoaded", function () {
        loadSensorData(1);

        document.getElementById('btn-refresh').addEventListener('click', function () {
            loadSensorData(currentPage);
        });
    });
</script>
{% endblock %}
